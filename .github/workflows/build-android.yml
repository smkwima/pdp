name: Build Aplikasi Android

on:
  workflow_dispatch:        # jalankan manual: tab Actions -> Build Aplikasi Android -> Run workflow
  push:
    tags: ['v*']            # atau otomatis saat membuat tag, mis. v1.0.0

permissions:
  contents: write           # diperlukan untuk membuat Release saat ada tag

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk PDP-Wima-Android.apk

      - name: Unggah APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PDP-Wima-Android
          path: android/PDP-Wima-Android.apk
          if-no-files-found: error

      - name: Buat Release (khusus tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/PDP-Wima-Android.apk
