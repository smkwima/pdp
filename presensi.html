<style>
  /* Presensi memakai kerangka & warna yang sama dengan halaman lain (style.css).
     Di sini hanya komponen khusus presensi, semuanya berawalan ps-. */
  .ps-wrap { max-width: 1180px; margin: 0 auto; }
  .mut { color: var(--ink-soft); }
  .ok { color: var(--success); }
  .warn { color: #b45309; }
  .bad { color: var(--danger); }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* Ikon Lucide diganti menjadi <svg>, jadi ukuran ikon di judul kartu, label, dan tab diatur di sini */
  .task-section__title svg, .stat-card__label svg, .subtab-btn svg { width: 16px; height: 16px; flex: none; }
  .task-section__title svg { color: var(--primary); }
  .stat-card__label svg { width: 14px; height: 14px; color: var(--primary); }
  .subtab-btn svg { width: 14px; height: 14px; }
  .task-section__title { min-width: 0; }

  /* ---------- Notifikasi ---------- */
  #msg { position: fixed; top: 78px; right: 24px; z-index: 90; width: min(360px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .ps-toast { pointer-events: auto; cursor: pointer; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; line-height: 1.45; box-shadow: var(--shadow-lg); animation: psIn .18s ease; }
  .ps-toast--bad { background: var(--danger); }
  @keyframes psIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  /* ---------- Isian & tombol ---------- */
  .ps-wrap input[type="date"], .ps-wrap input[type="time"], .ps-wrap input[type="text"],
  .ps-wrap input[type="number"], .ps-wrap input[type="search"], .ps-wrap select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface); font: 500 13px var(--font-body); color: var(--ink);
  }
  .ps-wrap input:focus, .ps-wrap select:focus { outline: none; border-color: var(--primary-soft); box-shadow: 0 0 0 3px var(--primary-tint-strong); }
  .ps-wrap .btn-small { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .ps-wrap .btn-small svg, .ps-wrap .btn-small i { width: 14px; height: 14px; flex: none; }
  .ps-wrap button:disabled { opacity: .55; cursor: default; }
  .ps-wrap .field label { font-size: 12px; color: var(--ink-soft); }
  .ps-file { width: 100%; padding: 8px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); background: var(--surface-tint); font: 500 12.5px var(--font-body); color: var(--ink-soft); }
  .ps-file::file-selector-button { margin-right: 10px; padding: 7px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); font: 600 12px var(--font-body); cursor: pointer; }
  .ps-file::file-selector-button:hover { background: var(--surface-tint-strong); border-color: var(--primary-soft); }
  .ps-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .ps-inline { display: flex; gap: 8px; align-items: center; }
  .ps-inline > input { flex: 1; min-width: 0; }
  .ps-hint { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 12px 0 0; }
  .ps-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; }
  .ps-narrow { max-width: 780px; }

  /* ---------- Susunan kartu ---------- */
  #view .task-section { margin: 0 0 18px; }
  .ps-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; align-items: start; margin-bottom: 18px; }
  .ps-cols > .task-section { margin: 0; }
  .ps-stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .ps-stack > .task-section { margin: 0; }

  /* ---------- Chip status ---------- */
  .ps-st { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
  .ps-st--ok { background: var(--success-tint); color: var(--success); border-color: var(--success-border); }
  .ps-st--warn { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .ps-st--info { background: var(--primary-tint); color: var(--primary-dim); border-color: var(--primary-tint-strong); }
  .ps-st--mut { background: var(--surface-tint-strong); color: var(--ink-soft); border-color: var(--border); }

  /* ---------- Halaman Presensi ---------- */
  .ps-presensi { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .ps-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #view .ps-side .stat-grid { margin: 0; grid-template-columns: 1fr 1fr; }
  .ps-main { min-width: 0; }
  .ps-hero { background: linear-gradient(135deg, var(--primary), #4f46e5); color: #fff; border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-md); }
  .ps-hero__label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: rgba(255,255,255,.8); }
  .ps-hero__label svg, .ps-hero__label i { width: 14px; height: 14px; }
  .ps-clock { font-family: var(--font-display); font-size: 46px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; margin: 10px 0 4px; }
  .ps-hero__date { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.92); }
  .ps-hero__jadwal { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.22); font-size: 13px; line-height: 1.55; }
  .ps-hero__src { font-size: 12px; color: rgba(255,255,255,.75); }
  .ps-side .stat-card__value { font-size: 22px; font-variant-numeric: tabular-nums; }
  .ps-side .stat-card__sub { margin-top: 8px; color: var(--ink-soft); }

  .ps-cam { position: relative; width: 100%; margin: 0 auto; aspect-ratio: 4 / 5; max-height: 62vh; max-height: 62dvh; border-radius: var(--radius); overflow: hidden; background: #0f172a; }
  .ps-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0f172a; }
  .ps-cam__wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; background: #0f172a; color: #cbd5e1; font-size: 13px; font-weight: 600; line-height: 1.5; }

  .ps-loc { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-tint); font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
  .ps-loc::before { content: ""; flex: none; width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: var(--ink-faint); }
  .ps-loc b { display: block; font-size: 13.5px; color: var(--ink); }
  .ps-loc span { display: block; font-size: 12px; }
  .ps-loc--ok { background: var(--success-tint); border-color: var(--success-border); }
  .ps-loc--ok::before { background: var(--success); }
  .ps-loc--ok b { color: var(--success); }
  .ps-loc--bad { background: var(--danger-tint); border-color: var(--danger-border); }
  .ps-loc--bad::before { background: var(--danger); }
  .ps-loc--bad b { color: var(--danger); }
  .ps-loc--wait::before { width: 14px; height: 14px; margin-top: 3px; background: transparent; border: 2px solid var(--primary-tint-strong); border-top-color: var(--primary); animation: sp .8s linear infinite; }

  .ps-cta { margin-top: 14px; }
  .ps-cta .btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; margin: 0; font-size: 14.5px; }
  .ps-cta .btn-primary svg, .ps-cta .btn-primary i { width: 18px; height: 18px; }

  .ps-notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); font-size: 13.5px; line-height: 1.55; }
  .ps-notice[hidden] { display: none; }
  .ps-petunjuk { display: block; padding: 0; }
  .ps-petunjuk > summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; list-style: none; }
  .ps-petunjuk > summary::-webkit-details-marker { display: none; }
  .ps-petunjuk > summary > b { display: inline; }
  .ps-petunjuk__hint { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  .ps-petunjuk[open] .ps-petunjuk__hint { display: none; }
  .ps-petunjuk[open] > summary { margin-left: 0; }
  .ps-petunjuk[open] > summary .ps-petunjuk__chev { margin-left: auto; transform: rotate(180deg); }
  .ps-petunjuk__chev { width: 18px; height: 18px; flex: none; transition: transform .15s; }
  .ps-petunjuk__isi { padding: 0 16px 14px 48px; color: var(--ink-soft); font-size: 14px; }
  .ps-petunjuk__isi ol { margin: 0 !important; padding-left: 18px !important; }
  .ps-notice > svg, .ps-notice > i { width: 20px; height: 20px; flex: none; margin-top: 1px; }
  .ps-notice b { display: block; font-size: 14px; }
  .ps-notice span { color: var(--ink-soft); }
  .ps-notice--ok { background: var(--success-tint); border-color: var(--success-border); color: var(--success); }
  .ps-notice--ok span { color: #047857; }
  .ps-notice--info { background: var(--primary-tint); border-color: var(--primary-tint-strong); color: var(--primary-dim); }
  .ps-notice--info span { color: var(--primary-dim); }
  .ps-notice--warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .ps-notice--warn span { color: #92400e; }
  .ps-notice--bad { background: var(--danger-tint); border-color: var(--danger-border); color: var(--danger); }
  .ps-notice--bad span { color: #b91c1c; }

  /* ---------- Rekap, tabel, filter ---------- */
  .ps-filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .ps-filter .field { margin: 0; min-width: 190px; }
  .ps-tbl td { vertical-align: middle; }
  .ps-time { font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .ps-belum { color: var(--ink-faint); font-weight: 600; }
  .ps-foto { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--primary); }
  .ps-foto svg, .ps-foto i { width: 13px; height: 13px; }
  .ps-tbl td.ps-empty { text-align: center; color: var(--ink-soft); padding: 28px 16px; }
  #view .stat-grid { margin-bottom: 16px; }

  /* ---------- Admin: jadwal & pengaturan ---------- */
  .ps-state { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 14px; font-size: 13px; font-weight: 600; }
  .ps-state::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #f59e0b; }
  .ps-state.ok::before { background: var(--success); }
  .ps-state.mut::before { background: var(--ink-faint); }
  .ps-jam { display: flex; flex-direction: column; gap: 10px; }
  .ps-jam__row { display: grid; grid-template-columns: 84px 1fr 1fr; gap: 10px; align-items: end; }
  .ps-jam__hari { font-size: 13.5px; font-weight: 700; padding-bottom: 10px; }
  .ps-jam .field { margin: 0; }
  .ps-jam .field label { font-size: 11px; margin-bottom: 4px; }
  .ps-jam__row:not(:first-child) .field label { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ps-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ps-tag { display: inline-flex; align-items: center; gap: 2px; padding: 3px 3px 3px 12px; border-radius: 999px; background: var(--primary-tint); border: 1px solid var(--primary-tint-strong); color: var(--primary-dim); font-size: 12.5px; font-weight: 600; }
  .ps-tag--fm { background: var(--accent-tint); border-color: #ddd6fe; color: var(--accent); }
  .ps-tag button { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 18px; line-height: 1; cursor: pointer; }
  .ps-tag button:hover { background: rgba(220, 38, 38, .12); color: var(--danger); }
  .ps-checklist { max-height: 300px; overflow: auto; margin-top: 12px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
  .ps-checklist .mut { display: block; padding: 12px; }
  .ps-check { display: flex; align-items: center; gap: 10px; margin: 0; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
  .ps-check:hover { background: var(--primary-tint); }
  .ps-check input { width: 18px; height: 18px; flex: none; accent-color: var(--primary); }
  .ps-savebar { position: sticky; bottom: 16px; z-index: 6; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); font-size: 12.5px; }
  .ps-line { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; line-height: 1.5; }
  .ps-line:last-child { border-bottom: 0; }
  .ps-line__ic { flex: none; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 800; }
  .ps-line--ok .ps-line__ic { background: var(--success-tint); color: var(--success); }
  .ps-line--warn .ps-line__ic { background: #fffbeb; color: #b45309; }
  .ps-line--bad .ps-line__ic { background: var(--danger-tint); color: var(--danger); }
  .ps-acc { margin: 0 0 14px; }
  .ps-acc > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; font-size: 14px; font-weight: 700; cursor: pointer; list-style: none; }
  .ps-acc > summary::-webkit-details-marker { display: none; }
  .ps-acc > summary::after { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--ink-soft); border-bottom: 2px solid var(--ink-soft); transform: rotate(45deg); transition: transform .15s ease; }
  .ps-acc[open] > summary { border-bottom: 1px solid var(--border); }
  .ps-acc[open] > summary::after { transform: rotate(-135deg); }
  .ps-acc__body { padding: 14px 18px 18px; }

  /* ---------- Tablet & HP ---------- */
  .ps-subtabs { display: none; }
  .ps-sm { display: none; }
  @media (max-width: 980px) {
    .ps-presensi { grid-template-columns: 1fr; }
  }
  @media (min-width: 861px) {
    .ps-cam { aspect-ratio: 4 / 3; max-height: none; max-width: 560px; }
  }
  @media (max-width: 860px) {
    .ps-subtabs { display: flex; }
    #msg { top: calc(64px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; width: auto; }
    .ps-clock { font-size: 38px; }
    .ps-hero { padding: 18px; }
    .ps-cta { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 4; margin-top: 8px; padding-top: 10px; background: linear-gradient(to top, var(--surface) 72%, rgba(255,255,255,0)); }
    .ps-savebar { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    .ps-savebar .btn-small { flex: 1 1 100%; }
    .ps-savebar .mut { display: none; }
    .ps-savebar { padding: 10px 12px; }
    .ps-filter .field, .ps-filter .btn-small { flex: 1 1 100%; }
    .ps-actions .btn-small { flex: 1 1 auto; }
    .ps-tbl.data-table--cards tr { padding: 12px 14px; gap: 10px; }
    .ps-tbl.data-table--cards td.td-nama { font-size: 15px; }
    .ps-tbl.data-table--cards td .ps-foto { margin-left: 0; margin-top: 4px; }
  }
  @media (max-width: 560px) {
    .ps-lg { display: none; }
    .ps-sm { display: inline; }
    .user-chip__logout { display: none; }
    .ps-jam__row { grid-template-columns: 1fr 1fr; }
    .ps-jam__hari { grid-column: 1 / -1; padding: 0; }
    .ps-inline { flex-wrap: wrap; }
    .ps-inline > .btn-small { flex: 1 1 100%; }
  }
</style>

<script>
// Semua data presensi (lokasi, jadwal, log, foto) disimpan di project presensi lewat Edge Function.
// Presensi memakai sesi login PDP (satu situs, satu sesi): tidak ada login sendiri di sini.
// supabaseClient dibuat oleh supabase-client.js (project e-Rapor/PDP).
const sb = supabaseClient;
// Database presensi ada di project Supabase TERPISAH (nrwexyezcbmsokelgkmp). Browser tidak memegang
// kunci project itu: semua baca/tulis lewat Edge Function yang memverifikasi sesi login e-Rapor.
const API_FN = "https://nrwexyezcbmsokelgkmp.supabase.co/functions/v1/presensi-api";
async function api(action, body = {}, timeoutMs = 0) {
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    if (!navigator.onLine) throw new TypeError("Tidak ada koneksi internet.");
    location.href = "index.html"; throw new Error("Sesi login habis. Silakan masuk lagi di PDP.");
  }
  const ac = timeoutMs ? new AbortController() : null, tm = ac && setTimeout(() => ac.abort(), timeoutMs);
  let r;
  try { r = await fetch(API_FN, { method: "POST", signal: ac?.signal, headers: { "Content-Type": "application/json", "x-rapor-token": data.session.access_token }, body: JSON.stringify({ action, ...body }) }); }
  finally { if (tm) clearTimeout(tm); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Server presensi menolak (" + r.status + ")");
  return j;
}
const $ = s => document.querySelector(s);
const HARI = ["", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
let me = null, cfg = null, stream = null, tab = "presensi", timer = null, watchId = null, depth = 0, presTok = 0;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(t, bad) {
  const d = document.createElement("div"); d.className = "ps-toast" + (bad ? " ps-toast--bad" : ""); d.textContent = t;
  d.onclick = () => d.remove(); $("#msg").append(d); setTimeout(() => d.remove(), bad ? 7000 : 5000);
}
const wib = d => new Date(d.toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
const ymd = d => { const w = wib(d); return `${w.getFullYear()}-${String(w.getMonth() + 1).padStart(2, "0")}-${String(w.getDate()).padStart(2, "0")}`; };
const hhmm = d => wib(d).toTimeString().slice(0, 8);
const hariKe = d => wib(d).getDay() || 7;

const antriKey = () => "pdp_tl_antri_" + me.id, cacheKey = () => "pdp_tl_cache_" + me.id;

let antriJalan = false;
async function kirimAntrian() { // kembalikan jumlah yang berhasil terkirim
  if (!me || antriJalan || !navigator.onLine) return 0;
  const a = antriBaca(); if (!a.length) return 0;
  antriJalan = true; let n = 0;
  try {
    for (const it of a) {
      try {
        await api("absen", { jenis: "tugas_luar", foto: it.foto, lat: it.lat, lng: it.lng, akurasi: it.akurasi, diambil: it.diambil }, 25000);

async function masuk(user) {
  let { data, error: pe } = await sb.from("profiles").select("id,nama,email,role,kode_mesin,nip").eq("id", user.id).maybeSingle();
  const kunciMe = "pdp_pres_me_" + user.id;   // salinan profil di HP agar halaman tetap terbuka tanpa sinyal
  if (!pe && data) { try { localStorage.setItem(kunciMe, JSON.stringify(data)); } catch {} }
  else if (pe) { try { const c = JSON.parse(localStorage.getItem(kunciMe) || "null"); if (c) { data = c; pe = null; } } catch {} }
  if (pe) return gagalView("Gagal membaca profil e-Rapor: " + pe.message);
  if (!data) return blokView("Profil e-Rapor tidak ditemukan untuk akun ini.");
  if (!["guru", "staf", "kepsek", "admin"].includes(data.role)) return blokView("Akun ini (peran " + data.role + ") tidak dipakai untuk presensi.");
  me = data; me.jabatan = { guru: "Guru", staf: "Staf", kepsek: "Kepala Sekolah", admin: "Admin" }[data.role];
  const kunciCfg = "pdp_pres_cfg_" + user.id;
  let tanpaSinyal = false;
  try { cfg = (await api("lokasi", {}, 8000)).lokasi; try { localStorage.setItem(kunciCfg, JSON.stringify(cfg)); } catch {} }
  catch (e) {
    if (!jaringanGagal(e)) return gagalView("Gagal memuat pengaturan presensi (jika baru pertama kali, jalankan setup.sql di project presensi dan deploy fungsi presensi-api): " + e.message);
    // Tanpa sinyal: tetap masuk. Presensi datang/pulang butuh server, tetapi Tugas Luar bisa dipakai dari data di HP.
    try { cfg = JSON.parse(localStorage.getItem(kunciCfg) || "null"); } catch { cfg = null; }
    tanpaSinyal = true;
  }
  const awal = (location.hash || "").replace("#", "");
  if (tanpaSinyal) { tab = "tugas"; history.replaceState({ d: 0, t: "tugas" }, ""); }
  else if (awal === "rekap" && (me.role === "admin" || me.role === "kepsek")) { tab = "rekap"; history.replaceState({ d: 0, t: "rekap" }, ""); }
  shell();
  kirimAntrian().then(segarkanSetelahKirim);
}

/* ---------- Kompres foto presensi (maks. FOTO_MAX_KB) ---------- */
const FOTO_MAX_KB = 20;
const TL_AKURASI_MAKS = 200; // Tugas Luar: titik lokasi diterima bila akurasi GPS ±200 m atau lebih baik
function kompres(v, c, label) {
  const g = c.getContext("2d"), batas = FOTO_MAX_KB * 1024, rasio = v.videoHeight / v.videoWidth;
  for (const w of [480, 400, 320, 260, 200, 160]) {
    c.width = w; c.height = Math.round(w * rasio);
    g.drawImage(v, 0, 0, c.width, c.height);
    const fs = Math.max(8, Math.round(w / 34)), bar = fs * 2.2;
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, c.height - bar, c.width, bar);
    g.fillStyle = "#fff"; g.font = fs + "px sans-serif"; g.fillText(label, 4, c.height - bar / 2 + fs / 3, c.width - 8);
    for (let q = 0.7; q >= 0.3; q -= 0.1) {
      const b64 = c.toDataURL("image/jpeg", q).split(",")[1];
      if (Math.floor(b64.length * 3 / 4) <= batas) return b64;
    }
  }
  return null;
}

/* ---------- Presensi ---------- */
let pilihJenis = null; // mode kamera yang dipilih pengguna bila ada lebih dari satu (datang / tugas_luar / pulang)
async function presensi() {
  const tok = ++presTok;
  let hi;
  try {
    if (!cfg) { cfg = (await api("lokasi", {}, 8000)).lokasi; try { localStorage.setItem("pdp_pres_cfg_" + me.id, JSON.stringify(cfg)); } catch {} }

    return viewGalat("Gagal memuat presensi: " + e.message);
  }
  if (tok !== presTok || tab !== "presensi") return;
  const tgl = hi.tanggal, hr = hi.log, ef = hi.ef, libur = ef.tipe === "libur" || ef.tipe === "fm";
  const datang = hr.find(x => x.jenis === "datang"), pulang = hr.find(x => x.jenis === "pulang"), tl = hr.find(x => x.jenis === "tugas_luar");
  const tg = hi.tugas; // Tugas Luar hari ini (diisi sendiri di menu Tugas Luar)
  const ij = !libur && !datang && !pulang && !tl && !tg ? hi.ijin : null; // ijin/sakit/dinas luar disetujui & belum presensi
  const bebasPulang = !!tg && !tg.wajib_pulang; // tugas selesai melewati jam pulang: tidak perlu absen pulang
  const opsi = [];
  if (!libur && !ij) {
    if (!datang && !tl) opsi.push("datang");
    if ((datang || tl) && !pulang && !bebasPulang) opsi.push("pulang");
  }
  if (pilihJenis && !opsi.includes(pilihJenis)) pilihJenis = null;
  const jenis = pilihJenis || opsi[0] || null, isTL = false;
  const jd = ef.tipe === "kerja" ? `Jadwal hari ini <b>${esc(ef.masuk)}–${esc(ef.pulang)}</b><br><span class="ps-hero__src">${esc(ef.sumber)}</span>`

    : `<b>Tidak ada jadwal hari ini.</b>`;

  const infoTugas = tg ? notice("info", "briefcase", "Tugas Luar hari ini: " + esc(tg.keperluan),

  const pilih = opsi.length > 1 ? `<div class="ps-actions" style="margin:0 0 14px">${opsi.map(o => `<button type="button" class="btn-small${o === jenis ? " btn-small--primary" : ""}" data-j="${o}">${o === "datang" ? "Presensi datang (di sekolah)" : o === "pulang" ? "Presensi pulang (di sekolah)" : ""}</button>`).join("")}</div>` : "";
  const kanan = jenis ? `<section class="task-section"><div class="task-section__head"><div><div class="task-section__title"><i data-lucide="camera"></i> ${isTL ? "Foto absen Tugas Luar" : "Foto presensi " + jenis}</div><div class="task-section__desc">${isTL ? "Cukup satu kali, setelah Anda tiba di lokasi tugas. Foto dan titik lokasi (koordinat GPS) tersimpan otomatis. Tidak ada batas radius sekolah." : "Pastikan wajah terlihat jelas dan Anda berada di area sekolah."}</div></div></div>
      <div class="task-section__body">${pilih}<div id="loc" class="ps-loc ps-loc--wait" style="margin:0 0 14px"><div><b>Mencari lokasi…</b><span>Aktifkan GPS dan izinkan akses lokasi.</span></div></div>
      <div class="ps-cam"><video id="vid" autoplay playsinline muted></video><div class="ps-cam__wait" id="camwait">Menyalakan kamera…</div></div><canvas id="cv" hidden></canvas>
      <div class="ps-cta"><button class="btn-primary" id="snap"><i data-lucide="camera"></i> ${isTL ? "Ambil foto &amp; kirim absen Tugas Luar" : "Ambil foto &amp; kirim presensi " + jenis}</button></div></div></section>`
    : ij ? notice("info", "calendar-check", "Hari ini tercatat " + esc(ij.label), "Pengajuan Anda sudah disetujui, jadi presensi tidak diperlukan. Jika Anda ternyata masuk, minta admin membatalkan pengajuannya di menu Ijin &amp; Dinas Luar. Jika Anda bertugas di luar dan <b>perlu absen</b>, gunakan menu Tugas Luar.")

  timer = setInterval(() => { const e = $("#clk"); if (e && e.firstChild) e.firstChild.nodeValue = hhmm(new Date()); }, 1000);
  if (!jenis) return;
  const wait = $("#camwait"), kamGagal = m => { if (wait) wait.textContent = m; };
  if (!navigator.mediaDevices?.getUserMedia) { toast("Kamera tidak didukung di perangkat ini.", true); kamGagal("Kamera tidak didukung di perangkat ini."); }
  else try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640 }, audio: false });
    if (tok !== presTok || tab !== "presensi" || !$("#vid")) { s.getTracks().forEach(t => t.stop()); return; }
    stream = s; const v = $("#vid"); v.srcObject = s; v.addEventListener("playing", () => wait?.remove(), { once: true });

      const bagus = pos.accuracy <= TL_AKURASI_MAKS;
      L.className = "ps-loc " + (bagus ? "ps-loc--ok" : "ps-loc--wait");
      L.innerHTML = `<div><b>${bagus ? "Titik lokasi terbaca" : "Menunggu GPS lebih akurat…"}</b><span>${pos.latitude.toFixed(6)}, ${pos.longitude.toFixed(6)} · akurasi ±${Math.round(pos.accuracy)} m${bagus ? "" : " (perlu ±" + TL_AKURASI_MAKS + " m atau lebih baik; pindah ke tempat terbuka)"}</span></div>`;
      return;
    }
    const d = jarak(cfg.lat, cfg.lng, pos.latitude, pos.longitude), ok = d <= cfg.radius_m;
    L.className = "ps-loc " + (ok ? "ps-loc--ok" : "ps-loc--bad");
    L.innerHTML = `<div><b>${ok ? "Di dalam area" : "Di luar area"}</b><span>${d} m dari ${esc(cfg.nama_lokasi)} · batas ${cfg.radius_m} m · akurasi ±${Math.round(pos.accuracy)} m</span></div>`;
  }, () => {
    const L = $("#loc"); if (!L) return;
    L.className = "ps-loc ps-loc--bad"; L.innerHTML = `<div><b>Lokasi tidak aktif</b><span>Aktifkan GPS dan izinkan akses lokasi.</span></div>`;
  }, { enableHighAccuracy: true });
  const btn = $("#snap"), btnHtml = btn.innerHTML;
  btn.onclick = async () => {
    if (!pos) return toast("Lokasi belum didapat.", true);
    if (isTL) { if (pos.accuracy > TL_AKURASI_MAKS) return toast(`Akurasi GPS masih ±${Math.round(pos.accuracy)} m. Tunggu sebentar atau pindah ke tempat terbuka.`, true); }
    else if (jarak(cfg.lat, cfg.lng, pos.latitude, pos.longitude) > cfg.radius_m) return toast("Anda di luar radius presensi.", true);
    const v = $("#vid"), c = $("#cv"); if (!v.videoWidth) return toast("Kamera belum siap.", true);
    const label = `${isTL ? "TUGAS LUAR · " : ""}${me.nama} · ${tgl} ${hhmm(new Date())} · ${pos.latitude.toFixed(5)},${pos.longitude.toFixed(5)}`;
    const b64 = kompres(v, c, label);
    if (!b64) return toast("Foto tidak bisa diperkecil hingga " + FOTO_MAX_KB + " KB. Coba lagi.", true);
    btn.disabled = true; btn.textContent = "Mengirim…";
    let hasil;
    try { hasil = await api("absen", { jenis, foto: b64, lat: pos.latitude, lng: pos.longitude, akurasi: Math.round(pos.accuracy) }); }
    catch (e) { btn.disabled = false; btn.innerHTML = btnHtml; ikon(); return toast(e.message, true); }
    toast(isTL ? "Absen Tugas Luar tercatat beserta titik lokasi." : `Presensi ${jenis} tercatat (${hasil.status}).`);
    pilihJenis = null; stop(); shell();
  };
}

async function kameraTL(tok, tgl) {
  const ok = () => tok === presTok && tab === "tugas";
  const wait = $("#camwait"), kamGagal = m => { if (wait) wait.textContent = m; };
  if (!navigator.mediaDevices?.getUserMedia) { toast("Kamera tidak didukung di perangkat ini.", true); kamGagal("Kamera tidak didukung di perangkat ini."); }
  else try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640 }, audio: false });
    if (!ok() || !$("#vid")) { s.getTracks().forEach(t => t.stop()); return; }
    stream = s; const v = $("#vid"); v.srcObject = s; v.addEventListener("playing", () => wait?.remove(), { once: true });
  } catch {
    if (!ok()) return;
    toast("Kamera tidak bisa diakses. Izinkan kamera di pengaturan browser.", true);
    kamGagal("Kamera tidak bisa diakses. Izinkan akses kamera di pengaturan browser, lalu muat ulang halaman.");
  }
  if (!ok()) return;
  let pos = null;
  watchId = navigator.geolocation.watchPosition(p => {
    const L = $("#loc"); if (!L) return;
    pos = p.coords;
    const bagus = pos.accuracy <= TL_AKURASI_MAKS;
    L.className = "ps-loc " + (bagus ? "ps-loc--ok" : "ps-loc--wait");
    L.innerHTML = `<div><b>${bagus ? "Titik lokasi terbaca" : "Menunggu GPS lebih akurat…"}</b><span>${pos.latitude.toFixed(6)}, ${pos.longitude.toFixed(6)} · akurasi ±${Math.round(pos.accuracy)} m${bagus ? "" : " (perlu ±" + TL_AKURASI_MAKS + " m atau lebih baik; pindah ke tempat terbuka)"}</span></div>`;
  }, () => {
    const L = $("#loc"); if (!L) return;
    L.className = "ps-loc ps-loc--bad"; L.innerHTML = `<div><b>Lokasi tidak aktif</b><span>Aktifkan GPS dan izinkan akses lokasi.</span></div>`;
  }, { enableHighAccuracy: true });
  const btn = $("#snap"), btnHtml = btn.innerHTML;
  btn.onclick = async () => {
    if (!pos) return toast("Lokasi belum didapat.", true);
    if (pos.accuracy > TL_AKURASI_MAKS) return toast(`Akurasi GPS masih ±${Math.round(pos.accuracy)} m. Tunggu sebentar atau pindah ke tempat terbuka.`, true);
    const v = $("#vid"), c = $("#cv"); if (!v.videoWidth) return toast("Kamera belum siap.", true);
    const b64 = kompres(v, c, `TUGAS LUAR · ${me.nama} · ${tgl} ${hhmm(new Date())} · ${pos.latitude.toFixed(5)},${pos.longitude.toFixed(5)}`);
    if (!b64) return toast("Foto tidak bisa diperkecil hingga " + FOTO_MAX_KB + " KB. Coba lagi.", true);
    btn.disabled = true; btn.textContent = "Mengirim…";
    const diambil = new Date().toISOString(), badan = { jenis: "tugas_luar", foto: b64, lat: pos.latitude, lng: pos.longitude, akurasi: Math.round(pos.accuracy) };
    const simpanHP = () => { // tanpa sinyal: simpan di HP, kirim otomatis nanti
      const a = antriBaca();
      if (a.some(x => x.tanggal === tgl)) { toast("Absen hari ini sudah tersimpan di HP dan menunggu terkirim.", true); return tugas(); }
      a.push({ id: diambil + Math.random().toString(36).slice(2, 6), tanggal: tgl, foto: b64, lat: badan.lat, lng: badan.lng, akurasi: badan.akurasi, diambil });
      if (!antriTulis(a)) { btn.disabled = false; btn.innerHTML = btnHtml; ikon(); return toast("Tidak ada sinyal dan penyimpanan HP penuh/tidak tersedia. Pindah ke tempat yang ada sinyal lalu coba lagi.", true); }
      toast("Tidak ada sinyal. Foto dan titik lokasi tersimpan di HP, akan terkirim otomatis saat sinyal kembali.");
      tugas();
    };
    if (!navigator.onLine) return simpanHP();
    try { await api("absen", badan, 20000); }
    catch (e) { if (jaringanGagal(e)) return simpanHP(); btn.disabled = false; btn.innerHTML = btnHtml; ikon(); return toast(e.message, true); }
    toast("Absen Tugas Luar tercatat beserta foto dan titik lokasi."); tugas();
  };
}

/* ---------- Data pegawai (e-Rapor, hanya baca) & pengaturan admin ---------- */
let PROF = null, A = null;

async function muatProf(paksa) {

  return A = a;
}
const kodeNorm = v => { const k = parseInt(v, 10); return Number.isNaN(k) ? "" : String(k); };
const namaDari = id => PROF?.find(p => p.id === id)?.nama || id;
const simpanCfg = (key, value) => api("cfg_simpan", { key, value });
const tglIdn = d => d.slice(8) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4);
const hariNama = d => HARI[new Date(d + "T00:00:00Z").getUTCDay() || 7];

/* ---------- Baca berkas Excel (format sama dengan aplikasi rekap) ---------- */
const DAYS = { SENIN: 1, SELASA: 2, RABU: 3, KAMIS: 4, JUMAT: 5, SABTU: 6 };
const tsec = v => { if (typeof v === "number") return Math.round(v * 86400); const m = typeof v === "string" && v.trim().match(/^(\d{1,2})[:.](\d{2})/); return m ? (+m[1] * 3600 + +m[2] * 60) : null; };
const jamStr = s => String(Math.floor(s / 3600)).padStart(2, "0") + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0");
function adaXlsx() { if (!window.XLSX) { toast("Pustaka Excel gagal dimuat (periksa internet), muat ulang halaman.", true); return false; } return true; }
function bacaXlsx(file) {
  return new Promise((ok, no) => {
    const r = new FileReader(); r.onerror = () => no(new Error("File tidak bisa dibaca"));
    r.onload = e => { try { ok(XLSX.read(e.target.result, { type: "array" })); } catch (x) { no(new Error("Bukan file Excel yang valid")); } };
    r.readAsArrayBuffer(file);
  });
}
const barisXls = ws => XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
// Sheet JADWAL: HARI | JAM AWAL | s.d. | JAM AKHIR | JP KE | JENIS | kolom kelas/ruang berisi kode mesin guru.
// Hasil: { kodeMesin: { hari: { in, out, jp, cls[] } } }  (jam masuk = jam awal paling pagi, pulang = jam akhir paling akhir)
function parseJadwal(wb) {
  const sj = wb.SheetNames.find(n => /jadwal/i.test(n)) || wb.SheetNames[0];
  const a = barisXls(wb.Sheets[sj]);
  const hi = a.findIndex(r => r && String(r[0]).toUpperCase() === "HARI");
  if (hi < 0) throw new Error("Baris judul “HARI” tidak ditemukan di sheet jadwal.");
  const h = a[hi], cols = [];
  for (let j = 6; j < h.length; j++) if (h[j]) cols.push([j, String(h[j])]);
  const sched = {}; let prevEnd = null;
  for (let i = hi + 1; i < a.length; i++) {
    const r = a[i]; if (!r) continue; const d = DAYS[String(r[0]).toUpperCase()]; if (!d) continue;
    const dur = String(r[5]).toUpperCase() === "S2" ? 25 : 30;
    const t1 = tsec(r[1]), t3 = tsec(r[3]); const st = t1 != null ? t1 : prevEnd;
    if (st == null) continue;
    let en = t3 != null ? t3 : st + dur * 60;
    if (en <= st) en = st + dur * 60;
    prevEnd = en;
    cols.forEach(([j, cn]) => {
      const v = r[j]; if (v == null || v === "") return;
      const id = String(parseInt(v, 10)); if (id === "NaN") return;
      const o = ((sched[id] = sched[id] || {})[d] = sched[id][d] || { in: st, out: en, jp: 0, cls: new Set() });
      o.in = Math.min(o.in, st); o.out = Math.max(o.out, en); o.jp++; o.cls.add(cn);
    });
  }
  Object.values(sched).forEach(dd => Object.values(dd).forEach(o => o.cls = [...o.cls]));
  return { sched };
}
function petakanJadwal(sched) {
  const peta = Object.fromEntries(PROF.filter(p => kodeNorm(p.kode_mesin)).map(p => [kodeNorm(p.kode_mesin), p.id]));
  const rows = [], miss = [], ada = new Set();
  for (const kode in sched) {
    const id = peta[kode]; if (!id) { miss.push(kode); continue; }
    ada.add(id);
    for (const h in sched[kode]) { const o = sched[kode][h]; rows.push({ pegawai_id: id, hari: +h, jam_masuk: jamStr(o.in), jam_pulang: jamStr(o.out), jp: o.jp, kelas: o.cls.join(", ") }); }
  }
  return { rows, miss, n: ada.size };
}
// Jadwal piket: (A) kolom per hari (SENIN ... SABTU) berisi nama / kode mesin, atau (B) baris per hari.
const dayOf = v => {
  if (v == null) return null;
  const m = String(v).trim().toLowerCase().match(/^(senin|selasa|rabu|kamis|jum['’`]?at|sabtu|minggu|ahad)(?![a-z])/); if (!m) return null;
  return { senin: 1, selasa: 2, rabu: 3, kamis: 4, jumat: 5, sabtu: 6, minggu: 7, ahad: 7 }[m[1].replace(/[^a-z]/g, "")];
};
const PK_SKIP = /^(no\.?|nama|name|id|kode|keterangan|ket\.?|hari|guru|petugas|piket|jam|peserta|tanggal)$/i;
function pkCells(v) {
  if (v == null || v === "") return [];
  if (typeof v === "number") return Number.isInteger(v) && v > 0 ? [{ k: "id", v: String(v) }] : [];
  return String(v).split(/\r?\n|;|\s\/\s/).map(x => x.trim().replace(/^\d+[.)]\s+/, "")).filter(x => x && !PK_SKIP.test(x)).map(x => /^\d+$/.test(x) ? { k: "id", v: x } : { k: "nm", v: x });
}
function parsePiket(wb) {
  const sn = wb.SheetNames.find(n => /piket/i.test(n)) || wb.SheetNames[0];
  const a = barisXls(wb.Sheets[sn]), list = {};
  const add = (d, es) => { if (!es.length) return; const l = (list[d] = list[d] || []); es.forEach(e => { if (!l.some(x => x.k === e.k && x.v === e.v)) l.push(e); }); };
  const hi = a.findIndex(r => r && r.filter(c => dayOf(c) != null).length >= 2);
  if (hi >= 0) {
    const cols = []; a[hi].forEach((c, j) => { const d = dayOf(c); if (d != null) cols.push([j, d]); });
    for (let i = hi + 1; i < a.length; i++) { const r = a[i]; if (!r) continue; cols.forEach(([j, d]) => add(d, pkCells(r[j]))); }
  } else {
    let cur = null;
    for (const r of a) {
      if (!r) continue;
      const j = r.findIndex(c => dayOf(c) != null);
      if (j >= 0) { cur = dayOf(r[j]); add(cur, r.slice(j + 1).flatMap(pkCells)); }
      else if (cur != null) add(cur, r.flatMap(c => typeof c === "string" ? pkCells(c) : []));
    }
  }
  if (!Object.keys(list).length) throw new Error("Format jadwal piket tidak dikenali. Gunakan kolom per hari (SENIN sampai SABTU) atau baris per hari berisi nama peserta.");
  return list;
}
const nrm = t => String(t).toLowerCase().replace(/,.*$/, "").replace(/[^a-z0-9 ]/g, " ").replace(/\b(drs|dra|dr|hj|h|ir)\b/g, " ").replace(/\s+/g, " ").trim();
function petakanPiket(list) {
  const byN = PROF.map(p => [nrm(p.nama || ""), p.id]).filter(x => x[0]);
  const byK = Object.fromEntries(PROF.filter(p => kodeNorm(p.kode_mesin)).map(p => [kodeNorm(p.kode_mesin), p.id]));
  const find = v => {
    const n = nrm(v); if (!n) return null;
    let m = byN.filter(x => x[0] === n);
    if (!m.length && n.length >= 4) m = byN.filter(x => x[0].includes(n) || n.includes(x[0]));
    const u = [...new Set(m.map(x => x[1]))]; return u.length === 1 ? u[0] : null;
  };
  const out = {}, belum = new Set();
  for (const d in list) {
    const set = new Set();
    list[d].forEach(e => { const id = e.k === "id" ? byK[kodeNorm(e.v)] : find(e.v); id ? set.add(id) : belum.add(e.v); });
    if (set.size) out[d] = [...set];
  }
  return { out, belum: [...belum] };
}
function unduh(nama, sheets) {
  if (!adaXlsx()) return;
  const wb = XLSX.utils.book_new();
  sheets.forEach(([n, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), n));
  XLSX.writeFile(wb, nama);
}
function tplJadwal(kolom) {
  const H = ["HARI", "JAM AWAL", "S.D.", "JAM AKHIR", "JP KE", "JENIS (kosongkan; isi S2 jika 25 menit)", ...kolom];
  const row = (h, a, b, n, ...c) => { const o = {}; H.forEach((k, i) => o[k] = i === 0 ? h : i === 1 ? a : i === 2 ? "s.d." : i === 3 ? b : i === 4 ? n : i === 5 ? "" : (c[i - 6] ?? "")); return o; };
  return [["JADWAL", [row("SENIN", "07:00", "07:45", 1, 1, 2), row("SENIN", "07:45", "08:30", 2, 1, ""), row("SENIN", "08:30", "09:15", 3, "", 2),
    row("SELASA", "07:00", "07:45", 1, 2, 1), row("SELASA", "07:45", "08:30", 2, 2, ""), row("SABTU", "07:00", "07:45", 1, 1, 2)]]];
}
function tplPiket() {

}
async function unggahJadwal(jenis, file) {
  if (!file) return toast("Pilih file Excel dulu.", true);
  if (!adaXlsx()) return;
  try {
    await muatProf();
    const { sched } = parseJadwal(await bacaXlsx(file));
    const { rows, miss, n } = petakanJadwal(sched);
    if (!rows.length) return toast("Tidak ada kode mesin di file yang cocok dengan data pegawai e-Rapor." + (miss.length ? " Kode tidak ditemukan: " + miss.slice(0, 8).join(", ") : ""), true);
    const nama = jenis === "tes" ? "jadwal tes" : "jadwal reguler";
    if (!confirm(`Ganti SELURUH ${nama} dengan file ini?\n\n${n} pegawai terjadwal, ${rows.length} baris hari.` + (miss.length ? `\n${miss.length} kode mesin tidak cocok dengan data pegawai (dilewati): ${miss.slice(0, 8).join(", ")}${miss.length > 8 ? "…" : ""}` : ""))) return;
    const r = await api("jadwal_unggah", { jenis, rows, file: file.name });
    toast(`${r.pegawai} pegawai, ${r.tersimpan} baris ${nama} tersimpan.` + (miss.length ? ` ${miss.length} kode mesin dilewati.` : ""));
    A = null; jadwal();
  } catch (e) { toast(e.message, true); }
}
async function unggahPiket(file) {
  if (!file) return toast("Pilih file Excel dulu.", true);
  if (!adaXlsx()) return;
  try {
    await muatProf();
    const { out, belum } = petakanPiket(parsePiket(await bacaXlsx(file)));
    const n = Object.values(out).reduce((t, l) => t + l.length, 0);
    if (!n) return toast("Tidak ada nama/kode mesin piket yang cocok dengan data pegawai e-Rapor." + (belum.length ? " Contoh: " + belum.slice(0, 5).join(", ") : ""), true);
    if (!confirm(`Ganti SELURUH jadwal piket dengan file ini?\n\n${n} peserta di ${Object.keys(out).length} hari.` + (belum.length ? `\n${belum.length} nama belum cocok (dilewati): ${belum.slice(0, 6).join(", ")}${belum.length > 6 ? "…" : ""}` : ""))) return;
    await api("piket_simpan", { list: out, belum, file: file.name });
    toast(`Jadwal piket tersimpan (${n} peserta).` + (belum.length ? ` ${belum.length} nama belum cocok.` : ""));
    A = null; jadwal();
  } catch (e) { toast(e.message, true); }
}

function bentrokPeng(P) {
  const R = [["Jadwal tes", P.tes.dari, P.tes.sampai], ["Pasca tes", P.pasca.dari, P.pasca.sampai], ["Piket", P.piket.dari, P.piket.sampai]].filter(r => r[1] && r[2] && r[1] <= r[2]);
  const m = [];
  for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++) {
    const f = R[i][1] > R[j][1] ? R[i][1] : R[j][1], t = R[i][2] < R[j][2] ? R[i][2] : R[j][2];
    if (f <= t) m.push(`${R[i][0]} dan ${R[j][0]} bertabrakan pada ${f === t ? tglIdn(f) : tglIdn(f) + " s.d. " + tglIdn(t)}`);
  }
  return m;
}
const bacaPeng = () => ({
  staf: Object.fromEntries([1, 2, 3, 4, 5, 6].map(h => [h, { masuk: $("#sm" + h).value, pulang: $("#sp" + h).value }])),

  piket: { dari: $("#a4f").value, sampai: $("#a4t").value, masuk: $("#a4i").value, pulang: $("#a4o").value },
});
function fmGroups(fm) {
  const g = [];
  fm.forEach(x => {
    const l = g[g.length - 1];
    const gap = l ? (Date.parse(x.d + "T00:00:00Z") - Date.parse(l.e + "T00:00:00Z")) / 864e5 : 0;
    const ok = l && l.ket === x.ket && (gap === 1 || (gap === 2 && new Date(Date.parse(l.e + "T00:00:00Z") + 864e5).getUTCDay() === 0));
    if (ok) l.e = x.d; else g.push({ s: x.d, e: x.d, ket: x.ket });
  });
  return g;
}

  $("#cgo").onclick = lihat; lihat();
  $("#dr").addEventListener("toggle", function () { if (this.open && !$("#tr").innerHTML) isiMingguan("reguler", $("#tr")); });
  $("#dt")?.addEventListener("toggle", function () { if (this.open && !$("#tt").innerHTML) isiMingguan("tes", $("#tt")); });
}

/* ---------- Admin: data guru (sinkron e-Rapor) ---------- */
async function daftar() {
  const { data, error } = await sb.from("profiles").select("nama,email,role,kode_mesin").in("role", ["guru", "staf", "kepsek"]).order("nama");
  if (error) return viewGalat("Gagal membaca data pegawai e-Rapor: " + error.message);
  if (tab !== "daftar") return;
  const kosong = data.filter(p => !p.kode_mesin).length;
  $("#view").innerHTML = `<div class="panel-head"><div><div class="panel-head__title">${data.length} pegawai dari e-Rapor</div><div class="panel-head__desc">Data dibaca langsung dari e-Rapor (hanya baca), tanpa sinkron. Kode mesin diisi di menu Guru PDP.</div></div></div>
  ${kosong ? `<div style="margin-bottom:16px">${notice("warn", "triangle-alert", kosong + " orang belum punya kode mesin", "Jadwalnya tidak bisa diunggah.")}</div>` : ""}
  <div class="table-wrap"><table class="data-table ps-tbl"><thead><tr><th>Kode mesin</th><th>Nama</th><th>Email</th><th>Peran</th></tr></thead><tbody>${data.map(p => `<tr><td>${esc(p.kode_mesin) || "—"}</td><td>${esc(p.nama)}</td><td>${esc(p.email)}</td><td><span class="ps-st ps-st--info">${esc(p.role)}</span></td></tr>`).join("") || `<tr><td colspan="4" class="ps-empty">Belum ada data.</td></tr>`}</tbody></table></div>`;
  ikon();
}
init();
