<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<title>Panduan PDP — PORTAL DATA DAN PENILAIAN SMK WIDYA MANDALA TAMBAK</title>
<script src="pwa.js" defer></script>
<style>
  :root { --bg:#eef2f6; --card:#fff; --ink:#0f172a; --mute:#64748b; --line:#d5dde6; --accent:#0b2b4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1a24; --card:#152634; --ink:#e6eef4; --mute:#9db1c0; --line:#27404f; --accent:#5cc0dc; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
         background: var(--bg); border-bottom: 1px solid var(--line);
         padding: calc(env(safe-area-inset-top, 0px) + 8px) 14px 8px; }
  .bar a, .bar button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line);
         border-radius: 999px; background: var(--card); color: var(--ink); font: 600 14px inherit; font-family: inherit; text-decoration: none; cursor: pointer; }
  .bar a:hover, .bar a:focus-visible, .bar button:hover { border-color: var(--accent); color: var(--accent); outline: none; }
  .bar .judul { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #halaman { max-width: 920px; margin: 0 auto; padding: 14px 12px calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .pg { background: #fff; margin: 0 auto 14px; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.12); overflow: hidden; }
  .pg canvas { display: block; width: 100%; height: auto; }
  .pg--tunggu { min-height: 240px; display: grid; place-items: center; color: var(--mute); }
  .info { max-width: 560px; margin: 40px auto; padding: 0 20px; text-align: center; color: var(--mute); }
  .info b { color: var(--ink); }
  .info a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="bar">
  <a href="portal.html" id="kembali" aria-label="Kembali">&#8592; Kembali</a>
  <span class="judul">Panduan PDP</span>
  <a href="assets/Petunjuk_Penggunaan_PDP_Guru_dan_Staf.pdf" download id="unduh">Unduh PDF</a>
</div>
<div id="halaman"><div class="info" id="status">Memuat panduan…</div></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function () {
  var PDF = 'assets/Petunjuk_Penggunaan_PDP_Guru_dan_Staf.pdf';
  var wadah = document.getElementById('halaman'), status = document.getElementById('status');

  // Tombol kembali: mundur bila ada riwayat; jika tidak, tutup tab baru; cadangan: Menu Utama.
  document.getElementById('kembali').addEventListener('click', function (e) {
    e.preventDefault();
    if (history.length > 1) { history.back(); return; }
    try { window.close(); } catch (x) { /* abaikan */ }
    setTimeout(function () { location.href = 'portal.html'; }, 150);
  });

  function gagal(pesan) {
    status.innerHTML = '<b>Panduan belum bisa ditampilkan di sini.</b><br>' + pesan +
      '<br><br><a href="' + PDF + '">Buka / unduh file PDF</a>';
  }

  if (!window.pdfjsLib) { gagal('Pustaka pembaca PDF tidak termuat (periksa koneksi internet).'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

  pdfjsLib.getDocument(PDF).promise.then(function (pdf) {
    status.remove();
    var skala = Math.min(window.devicePixelRatio || 1, 2) * 1.5; // tajam di layar HP, tetap hemat memori
    var slot = [];
    for (var i = 1; i <= pdf.numPages; i++) {
      var d = document.createElement('div');
      d.className = 'pg pg--tunggu'; d.dataset.no = i; d.textContent = 'Halaman ' + i;
      wadah.appendChild(d); slot.push(d);
    }
    function gambar(el) {
      if (el.dataset.ok) return; el.dataset.ok = '1';
      pdf.getPage(Number(el.dataset.no)).then(function (pg) {
        var vp = pg.getViewport({ scale: skala });
        var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        return pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () {
          el.className = 'pg'; el.textContent = ''; el.appendChild(c);
        });
      }).catch(function () { el.dataset.ok = ''; el.textContent = 'Halaman ' + el.dataset.no + ' gagal dimuat'; });
    }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (en) { if (en.isIntersecting) { gambar(en.target); io.unobserve(en.target); } });
      }, { rootMargin: '600px 0px' });
      slot.forEach(function (el) { io.observe(el); });
    } else { slot.forEach(gambar); }
  }).catch(function (e) { gagal(String(e && e.message || e)); });
})();
</script>
</body>
</html>
